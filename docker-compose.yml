services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: docurag-postgres

    environment:
      POSTGRES_DB: docurag
      POSTGRES_USER: docurag
      POSTGRES_PASSWORD: docurag_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U docurag -d docurag"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped


volumes:
  postgres_data:
    external: true
    name: backend_postgres_data
